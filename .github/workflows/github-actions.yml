name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  eslint_job:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Check code style with Prettier and ESLint
        run: |
          echo "Checking code style with Prettier and ESLint..."
          pnpm run format
          pnpm run lint
  build_job:
    name: Build
    runs-on: ubuntu-latest
    needs: eslint_job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Check if the project builds
        env:
          DIRECTUS_CMS_URL: ${{ secrets.DIRECTUS_CMS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_DIRECTUS_CMS_URL: ${{ secrets.DIRECTUS_CMS_URL }}
        run: |
          echo "Checking if the project builds..."
          pnpm run build
  test_job:
    name: Test
    runs-on: ubuntu-latest
    needs: build_job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Run unit and integration tests
        env:
          DIRECTUS_CMS_URL: "https://${{ secrets.DIRECTUS_CMS_URL }}"
        run: |
          echo "Running unit and integration tests..."
          pnpm run test:unit
  e2e_test_job:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: build_job
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Run E2E API tests
        env:
          DIRECTUS_CMS_URL: ${{ secrets.DIRECTUS_CMS_URL }}
        run: |
          echo "Running E2E API tests..."
          pnpm run test:e2e:api
